<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한능검 심화 학습실</title>
<script>
// 예전 주소(/…/site/index.html 등)로 들어와도 학습실 첫 화면으로 보낸다.
(function(){var p=location.pathname,i=p.indexOf("/site/");
var base=i>=0?p.slice(0,i+1):p.replace(/[^\/]*$/,"");
location.replace((base||"/")+location.search);})();
</script>
<style>body{font:16px/1.7 system-ui,"Noto Sans KR",sans-serif;padding:32px;max-width:560px;margin:auto}</style>
</head><body>
<h1>찾는 페이지가 없어 첫 화면으로 이동합니다</h1>
<p>자동으로 이동하지 않으면 <a href="./">학습실 첫 화면</a>을 눌러 주세요.</p>
</body></html>
